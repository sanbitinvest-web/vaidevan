<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — VaideVan</title>
  <meta name="theme-color" content="#0A0A0A" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100dvh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:1.5rem;
      background:#0A0A0A;color:#fff;font-family:'Inter',system-ui,sans-serif;
      padding:2rem;text-align:center;
    }
    img{width:96px;height:96px;border-radius:50%}
    h1{font-size:1.5rem;font-weight:700;color:#F5E642}
    p{font-size:1rem;color:#aaa;max-width:320px;line-height:1.6}
    button{
      margin-top:.5rem;padding:.75rem 2rem;border-radius:9999px;border:none;
      background:#F5E642;color:#0A0A0A;font-weight:700;font-size:1rem;
      cursor:pointer;transition:opacity .2s;
    }
    button:hover{opacity:.85}
    small{color:#555;font-size:.8rem}
  </style>
</head>
<body>
  <img src="/icons/icon-96x96.png" alt="VaideVan" />
  <h1>Você está offline</h1>
  <p>Sem conexão com a internet. Verifique seu Wi-Fi ou dados móveis e tente novamente.</p>
  <button onclick="window.location.reload()">Tentar novamente</button>
  <small>vaidevan.com · Transporte Executivo 24h</small>
</body>
</html>
